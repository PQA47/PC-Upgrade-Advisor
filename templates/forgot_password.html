<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PC Upgrade Advisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0F172A] text-[#E2E8F0] flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-[#1E293B] border border-[#334155] rounded-2xl p-8 shadow-2xl">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-[#F1F5F9]">Forgot Password?</h1>
            <p class="text-[#94A3B8] mt-1">Reset your PC Upgrade Advisor password</p>
        </div>

        {% if message %}
        <div class="mb-5 rounded-xl border border-[#06B6D4]/30 bg-[#06B6D4]/10 px-4 py-3 text-sm text-[#06B6D4]">
            {{ message }}
        </div>
        {% endif %}

        {% if error %}
        <div class="mb-5 rounded-xl border border-[#EF4444]/30 bg-[#EF4444]/10 px-4 py-3 text-sm text-[#EF4444]">
            {{ error }}
        </div>
        {% endif %}

        <form action="/forgot-password" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm text-[#E2E8F0] mb-2">Email</label>
                <input
                    type="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="you@example.com"
                    class="w-full rounded-xl border border-[#334155] bg-[#0F172A] px-4 py-3 text-[#E2E8F0] placeholder-[#94A3B8] outline-none focus:border-[#06B6D4] transition"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-xl bg-[#3B82F6] py-3 font-semibold text-[#F1F5F9] hover:bg-blue-600 transition"
            >
                Send reset link
            </button>
        </form>

        <p class="text-center text-sm text-[#94A3B8] mt-6">
            Remember your password?
            <a href="/login" class="text-[#06B6D4] hover:underline">Back to Login</a>
        </p>

        <p class="text-center mt-4">
            <a href="/" class="text-sm text-[#94A3B8] hover:text-[#E2E8F0]">← Back to Home</a>
        </p>
    </div>
</body>
</html>
