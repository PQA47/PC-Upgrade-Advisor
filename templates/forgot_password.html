<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | PC Upgrade Advisor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background:
                radial-gradient(circle at 15% 20%, rgba(34, 211, 238, .10), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, .12), transparent 30%),
                #05070a;
        }

        .grid-bg {
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glass {
            background: rgba(15, 23, 42, .72);
            backdrop-filter: blur(18px);
        }

        .neon-text {
            text-shadow:
                0 0 10px rgba(34,211,238,.65),
                0 0 30px rgba(34,211,238,.25);
        }

        .input-field {
            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(34,211,238,.6);
            box-shadow:
                0 0 0 3px rgba(34,211,238,.08),
                0 0 20px rgba(34,211,238,.06);
        }
    </style>

<style id="global-space-background">
  html, body {
    min-height: 100%;
  }

  body {
    position: relative !important;
    background-color: transparent !important;
    background-image: none !important;
  }

  /* New space image */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: url("/static/images/web-background.webp") center center / cover no-repeat;
    z-index: 0;
    pointer-events: none;
  }

  /* Original dark/neon background kept as a translucent overlay */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
      radial-gradient(circle at 10% 10%, rgba(34,211,238,.10), transparent 28%),
      radial-gradient(circle at 90% 80%, rgba(168,85,247,.12), transparent 30%),
      linear-gradient(rgba(5,7,10,.42), rgba(5,7,10,.42));
    background-size: 40px 40px, 40px 40px, auto, auto, auto;
  }

  body > * {
    position: relative;
    z-index: 1;
  }

  .grid-bg {
    display: none !important;
  }
</style>


<style id="square-ui-overrides">
/* Global square-corner UI: intentionally removes all rounded corners. */
*, *::before, *::after {
  border-radius: 0 !important;
}
</style>
</head>


<body class="min-h-screen text-slate-100">

    <!-- Background -->
    <div class="fixed inset-0 grid-bg pointer-events-none"></div>

    <div class="fixed -top-40 -left-40
                w-96 h-96 rounded-full
                bg-cyan-500/10 blur-3xl
                pointer-events-none"></div>

    <div class="fixed -bottom-40 -right-40
                w-96 h-96 rounded-full
                bg-purple-600/10 blur-3xl
                pointer-events-none"></div>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="relative z-10
                border-b border-slate-900
                bg-slate-950/70
                backdrop-blur">

        <div class="max-w-7xl mx-auto
                    px-5 sm:px-8 py-5">

            <div class="flex items-center
                        justify-between">

                <a href="/"
                   class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-xl
                                border border-cyan-400/40
                                bg-cyan-400/5
                                flex items-center justify-center">

                        <span class="text-xl">⚡</span>

                    </div>

                    <div>

                        <div class="text-[20px]
                                    text-slate-500
                                    tracking-[0.25em]">

                            PC UPGRADE ADVISOR

                        </div>

                    </div>

                </a>


                <a href="/login"
                   class="text-sm text-slate-400
                          hover:text-cyan-300
                          transition">

                    ← Back to Login

                </a>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         FORGOT PASSWORD
    ====================================================== -->

    <main class="relative z-10
                 min-h-[calc(100vh-81px)]
                 flex items-center
                 justify-center
                 px-5 py-12">

        <div class="w-full max-w-md">


            <!-- Heading -->

            <div class="text-center mb-8">

                <div class="inline-flex
                            items-center
                            gap-2
                            text-xs
                            text-purple-400
                            uppercase
                            tracking-[0.3em]">

                    <span class="w-2 h-2 rounded-full
                                 bg-purple-400
                                 shadow-[0_0_10px_rgba(168,85,247,.9)]">
                    </span>

                    Account Recovery

                </div>


                <h1 class="text-4xl sm:text-5xl
                           font-black
                           tracking-tight
                           mt-4">

                    RESET

                    <span class="text-cyan-400 neon-text">
                        PASSWORD
                    </span>

                </h1>


                <p class="text-slate-500 mt-3">

                    Enter your email and we'll send you
                    a password reset link.

                </p>

            </div>


            <!-- Card -->

            <div class="glass
                        border border-slate-800
                        rounded-2xl
                        p-6 sm:p-8
                        shadow-2xl">


                <!-- Error -->

                {% if error %}

                <div class="mb-6 rounded-xl
                            border border-red-400/30
                            bg-red-400/5
                            p-4">

                    <div class="text-sm text-red-400">

                        {{ error }}

                    </div>

                </div>

                {% endif %}


                <!-- Success -->

                {% if message %}

                <div class="mb-6 rounded-xl
                            border border-emerald-400/30
                            bg-emerald-400/5
                            p-4">

                    <div class="text-sm text-emerald-400">

                        {{ message }}

                    </div>

                </div>

                {% endif %}


                <!-- Form -->

                <form action="/forgot-password"
                      method="POST"
                      class="space-y-5">


                    <div>

                        <label for="email"
                               class="block
                                      text-xs
                                      font-bold
                                      uppercase
                                      tracking-wider
                                      text-slate-400
                                      mb-2">

                            Account Email

                        </label>


                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            placeholder="you@example.com"
                            class="input-field
                                   w-full
                                   rounded-xl
                                   border border-slate-700
                                   bg-slate-950/80
                                   px-4 py-3.5
                                   text-slate-100
                                   placeholder:text-slate-600">

                    </div>


                    <button
                        type="submit"
                        class="w-full
                               rounded-xl
                               bg-cyan-500
                               hover:bg-cyan-400
                               text-slate-950
                               font-black
                               py-3.5
                               transition
                               shadow-[0_0_25px_rgba(34,211,238,.12)]">

                        ✉ SEND RESET LINK

                    </button>

                </form>


                <!-- Back -->

                <div class="mt-6 text-center">

                    <a href="/login"
                       class="text-sm
                              text-slate-500
                              hover:text-cyan-300
                              transition">

                        Remember your password?
                        <span class="text-cyan-400">
                            Login
                        </span>

                    </a>

                </div>

            </div>


            <!-- Footer -->

            <div class="text-center
                        text-xs
                        text-slate-600
                        mt-7">

                PC Upgrade Advisor
                · Account Recovery

            </div>

        </div>

    </main>

</body>
</html>
