<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | PC Upgrade Advisor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background:
                radial-gradient(circle at 15% 20%, rgba(34, 211, 238, .10), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, .12), transparent 30%),
                #05070a;
        }

        .grid-bg {
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glass {
            background: rgba(15, 23, 42, .72);
            backdrop-filter: blur(18px);
        }

        .neon-text {
            text-shadow:
                0 0 10px rgba(34,211,238,.65),
                0 0 30px rgba(34,211,238,.25);
        }

        .input-field {
            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(34,211,238,.6);
            box-shadow:
                0 0 0 3px rgba(34,211,238,.08),
                0 0 20px rgba(34,211,238,.06);
        }
    </style>

<style id="global-space-background">
  html, body {
    min-height: 100%;
  }

  body {
    position: relative !important;
    background-color: transparent !important;
    background-image: none !important;
  }

  /* New space image */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: url("/static/images/web-background.webp") center center / cover no-repeat;
    z-index: 0;
    pointer-events: none;
  }

  /* Original dark/neon background kept as a translucent overlay */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
      radial-gradient(circle at 10% 10%, rgba(34,211,238,.10), transparent 28%),
      radial-gradient(circle at 90% 80%, rgba(168,85,247,.12), transparent 30%),
      linear-gradient(rgba(5,7,10,.42), rgba(5,7,10,.42));
    background-size: 40px 40px, 40px 40px, auto, auto, auto;
  }

  body > * {
    position: relative;
    z-index: 1;
  }

  .grid-bg {
    display: none !important;
  }
</style>

</head>


<body class="min-h-screen text-slate-100">

    <!-- Background -->
    <div class="fixed inset-0 grid-bg pointer-events-none"></div>

    <div class="fixed -top-40 -left-40
                w-96 h-96 rounded-full
                bg-cyan-500/10 blur-3xl
                pointer-events-none"></div>

    <div class="fixed -bottom-40 -right-40
                w-96 h-96 rounded-full
                bg-purple-600/10 blur-3xl
                pointer-events-none"></div>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="relative z-10
                border-b border-slate-900
                bg-slate-950/70
                backdrop-blur">

        <div class="max-w-7xl mx-auto
                    px-5 sm:px-8 py-5">

            <div class="flex items-center
                        justify-between">

                <a href="/"
                   class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-xl
                                border border-cyan-400/40
                                bg-cyan-400/5
                                flex items-center justify-center">

                        <span class="text-xl">⚡</span>

                    </div>

                    <div>

                        <div class="text-[20px]
                                    text-slate-500
                                    tracking-[0.25em]">

                            PC UPGRADE ADVISOR

                        </div>

                    </div>

                </a>


                <a href="/"
                   class="text-sm text-slate-400
                          hover:text-cyan-300
                          transition">

                    ← Back to Home

                </a>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         REGISTER
    ====================================================== -->

    <main class="relative z-10
                 min-h-[calc(100vh-81px)]
                 flex items-center
                 justify-center
                 px-5 py-12">


        <div class="w-full max-w-md">


            <!-- Heading -->

            <div class="text-center mb-8">

                <div class="inline-flex
                            items-center
                            gap-2
                            text-xs
                            text-purple-400
                            uppercase
                            tracking-[0.3em]">

                    <span class="w-2 h-2 rounded-full
                                 bg-purple-400
                                 shadow-[0_0_10px_rgba(168,85,247,.9)]">
                    </span>

                    New User

                </div>


                <h1 class="text-4xl sm:text-5xl
                           font-black
                           tracking-tight
                           mt-4">

                    CREATE

                    <span class="text-cyan-400 neon-text">
                        ACCOUNT
                    </span>

                </h1>


                <p class="text-slate-500 mt-3">

                    Save your PC analyses and access them anytime.

                </p>

            </div>


            <!-- Register Card -->

            <div class="glass
                        border border-slate-800
                        rounded-2xl
                        p-6 sm:p-8
                        shadow-2xl">


                <!-- Error -->

                {% if error %}

                <div class="mb-6 rounded-xl
                            border border-red-400/30
                            bg-red-400/5
                            p-4">

                    <div class="text-sm text-red-400">

                        {{ error }}

                    </div>

                </div>

                {% endif %}


                {% if message %}

                <div class="mb-6 rounded-xl
                            border border-emerald-400/30
                            bg-emerald-400/5
                            p-4">

                    <div class="text-sm text-emerald-400">

                        {{ message }}

                    </div>

                </div>

                {% endif %}


                <!-- Form -->

                <form action="/register"
                      method="POST"
                      class="space-y-5">


                    <!-- Username -->

                    <div>

                        <label for="username"
                               class="block
                                      text-xs
                                      font-bold
                                      uppercase
                                      tracking-wider
                                      text-slate-400
                                      mb-2">

                            Username

                        </label>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                            placeholder="Your username"
                            class="input-field
                                   w-full
                                   rounded-xl
                                   border border-slate-700
                                   bg-slate-950/80
                                   px-4 py-3.5
                                   text-slate-100
                                   placeholder:text-slate-600">

                    </div>


                    <!-- Email -->

                    <div>

                        <label for="email"
                               class="block
                                      text-xs
                                      font-bold
                                      uppercase
                                      tracking-wider
                                      text-slate-400
                                      mb-2">

                            Email

                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            placeholder="you@example.com"
                            class="input-field
                                   w-full
                                   rounded-xl
                                   border border-slate-700
                                   bg-slate-950/80
                                   px-4 py-3.5
                                   text-slate-100
                                   placeholder:text-slate-600">

                    </div>


                    <!-- Password -->

                    <div>

                        <label for="password"
                               class="block
                                      text-xs
                                      font-bold
                                      uppercase
                                      tracking-wider
                                      text-slate-400
                                      mb-2">

                            Password

                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            required
                            placeholder="••••••••"
                            class="input-field
                                   w-full
                                   rounded-xl
                                   border border-slate-700
                                   bg-slate-950/80
                                   px-4 py-3.5
                                   text-slate-100
                                   placeholder:text-slate-600">

                    </div>


                    <!-- Confirm Password -->

                    <div>

                        <label for="confirm_password"
                               class="block
                                      text-xs
                                      font-bold
                                      uppercase
                                      tracking-wider
                                      text-slate-400
                                      mb-2">

                            Confirm Password

                        </label>

                        <input
                            id="confirm_password"
                            name="confirm_password"
                            type="password"
                            autocomplete="new-password"
                            required
                            placeholder="••••••••"
                            class="input-field
                                   w-full
                                   rounded-xl
                                   border border-slate-700
                                   bg-slate-950/80
                                   px-4 py-3.5
                                   text-slate-100
                                   placeholder:text-slate-600">

                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="w-full
                               rounded-xl
                               bg-cyan-500
                               hover:bg-cyan-400
                               text-slate-950
                               font-black
                               py-3.5
                               transition
                               shadow-[0_0_25px_rgba(34,211,238,.12)]">

                        ⚡ CREATE ACCOUNT

                    </button>

                </form>


                <!-- Login -->

                <div class="relative my-7">

                    <div class="absolute inset-0
                                flex items-center">

                        <div class="w-full
                                    border-t
                                    border-slate-800">
                        </div>

                    </div>

                    <div class="relative
                                flex justify-center">

                        <span class="bg-slate-900/80
                                     px-3
                                     text-xs
                                     text-slate-600">

                            ALREADY HAVE AN ACCOUNT?

                        </span>

                    </div>

                </div>


                <a href="/login"
                   class="block w-full
                          text-center
                          rounded-xl
                          border border-slate-700
                          bg-slate-950
                          hover:border-cyan-400/40
                          hover:text-cyan-300
                          text-slate-300
                          font-bold
                          py-3.5
                          transition">

                    LOGIN

                </a>

            </div>


            <!-- Footer -->

            <div class="text-center
                        text-xs
                        text-slate-600
                        mt-7">

                PC Upgrade Advisor
                · Create your account

            </div>

        </div>

    </main>

</body>
</html>
