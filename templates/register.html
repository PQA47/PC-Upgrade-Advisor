<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PC Upgrade Advisor</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style id="theme-toggle-styles">
    /* Light-mode overrides for the existing Tailwind color palette. */
    html.light-mode body { background-color:#F8FAFC !important; color:#0F172A !important; }
    html.light-mode [class*="bg-[#0F172A]"] { background-color:#F8FAFC !important; }
    html.light-mode [class*="bg-[#1E293B]"] { background-color:#FFFFFF !important; }
    html.light-mode [class*="bg-[#334155]"] { background-color:#E2E8F0 !important; }
    html.light-mode [class*="bg-[#06B6D4]"] { background-color:#0891B2 !important; }
    html.light-mode [class*="bg-[#3B82F6]"] { background-color:#2563EB !important; }
    html.light-mode [class*="text-[#E2E8F0]"] { color:#0F172A !important; }
    html.light-mode [class*="text-[#F1F5F9]"] { color:#0F172A !important; }
    html.light-mode [class*="text-[#94A3B8]"] { color:#64748B !important; }
    html.light-mode [class*="text-[#64748B]"] { color:#475569 !important; }
    html.light-mode [class*="text-[#0F172A]"] { color:#F8FAFC !important; }
    html.light-mode [class*="border-[#334155]"] { border-color:#CBD5E1 !important; }
    html.light-mode [class*="border-[#06B6D4]"] { border-color:#0891B2 !important; }
    html.light-mode [class*="border-[#3B82F6]"] { border-color:#2563EB !important; }
    html.light-mode [class*="hover\\:bg-[#334155]"]:hover { background-color:#E2E8F0 !important; }
    html.light-mode [class*="hover\\:text-[#06B6D4]"]:hover { color:#0891B2 !important; }

    #theme-toggle {
      position:fixed;
      top:1rem;
      right:1rem;
      z-index:9999;
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      padding:.55rem .8rem;
      border:1px solid #334155;
      border-radius:.8rem;
      background:#1E293B;
      color:#E2E8F0;
      font-size:.8rem;
      font-weight:700;
      line-height:1;
      cursor:pointer;
      box-shadow:0 8px 24px rgba(15,23,42,.18);
      transition:background .2s ease,color .2s ease,border-color .2s ease,transform .15s ease;
    }
    #theme-toggle:hover { transform:translateY(-1px); }
    html.light-mode #theme-toggle {
      background:#FFFFFF;
      color:#0F172A;
      border-color:#CBD5E1;
      box-shadow:0 8px 24px rgba(15,23,42,.10);
    }
    #theme-toggle .theme-icon { font-size:1rem; }
    @media (max-width:640px) {
      #theme-toggle { top:.75rem; right:.75rem; padding:.5rem .65rem; }
      #theme-toggle .theme-label { display:none; }
    }
  </style>
  <script>
    // Apply the saved theme before the page renders to reduce light/dark flicker.
    (() => {
      try {
        if (localStorage.getItem('pc-advisor-theme') === 'light') {
          document.documentElement.classList.add('light-mode');
        }
      } catch (_) {}
    })();
  </script>

</head>

  <button id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch theme">
    <span class="theme-icon" aria-hidden="true">☀️</span>
    <span class="theme-label">Light mode</span>
  </button>
  <script>
    (() => {
      const root = document.documentElement;
      const button = document.getElementById('theme-toggle');
      if (!button) return;
      const icon = button.querySelector('.theme-icon');
      const label = button.querySelector('.theme-label');

      const updateThemeButton = () => {
        const light = root.classList.contains('light-mode');
        icon.textContent = light ? '🌙' : '☀️';
        label.textContent = light ? 'Dark mode' : 'Light mode';
        button.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
      };

      button.addEventListener('click', () => {
        const light = root.classList.toggle('light-mode');
        try { localStorage.setItem('pc-advisor-theme', light ? 'light' : 'dark'); } catch (_) {}
        updateThemeButton();
      });

      updateThemeButton();
    })();
  </script>

  <body class="min-h-screen bg-[#0F172A] text-[#E2E8F0] flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-[#1E293B] border border-[#334155] rounded-2xl p-8 shadow-2xl">
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-[#F1F5F9]">Create account</h1>
      <p class="text-[#94A3B8] mt-1">Save your PC analyses and view history</p>
    </div>
    {% if error %}
    <div class="mb-5 rounded-xl border border-[#EF4444]/30 bg-[#EF4444]/10 px-4 py-3 text-sm text-[#EF4444]">{{ error }}</div>
    {% endif %}
    <form action="/register" method="POST" class="space-y-5">
      <div>
        <label class="block text-sm text-[#E2E8F0] mb-2">Username</label>
        <input type="text" name="username" minlength="3" required autocomplete="username"
               class="w-full rounded-xl border border-[#334155] bg-[#0F172A] px-4 py-3 text-[#E2E8F0] placeholder-[#94A3B8] outline-none focus:border-[#06B6D4] transition">
      </div>
      <div>
        <label class="block text-sm text-[#E2E8F0] mb-2">Email</label>
        <input type="email" name="email" required autocomplete="email"
               class="w-full rounded-xl border border-[#334155] bg-[#0F172A] px-4 py-3 text-[#E2E8F0] placeholder-[#94A3B8] outline-none focus:border-[#06B6D4] transition">
      </div>
      <div>
        <label class="block text-sm text-[#E2E8F0] mb-2">Password</label>
        <input type="password" name="password" minlength="8" required autocomplete="new-password"
               class="w-full rounded-xl border border-[#334155] bg-[#0F172A] px-4 py-3 text-[#E2E8F0] placeholder-[#94A3B8] outline-none focus:border-[#06B6D4] transition">
      </div>
      <button type="submit" class="w-full rounded-xl bg-[#3B82F6] hover:bg-blue-600 py-3 font-semibold text-[#F1F5F9] transition">Create account</button>
    </form>
    <p class="text-center text-sm text-[#94A3B8] mt-6">
      Already have an account?
      <a href="/login" class="text-[#06B6D4] hover:underline">Login</a>
    </p>
    <p class="text-center mt-4"><a href="/" class="text-sm text-[#94A3B8] hover:text-[#E2E8F0]">← Back to home</a></p>
  </div>
</body>
</html>
