<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PC Upgrade Advisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="mb-6">
            <h1 class="text-3xl font-bold">Reset Password</h1>
            <p class="text-slate-400 mt-1">Create a new password for your account</p>
        </div>

        {% if error %}
        <div class="mb-5 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300">
            {{ error }}
        </div>
        {% endif %}

        <form action="/reset-password" method="POST" class="space-y-5">
            <input type="hidden" name="token" value="{{ token }}">

            <div>
                <label class="block text-sm text-slate-300 mb-2">New Password</label>
                <input
                    type="password"
                    name="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                    class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder-slate-500 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
                >
            </div>

            <div>
                <label class="block text-sm text-slate-300 mb-2">Confirm New Password</label>
                <input
                    type="password"
                    name="password_confirm"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter your password again"
                    class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder-slate-500 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-xl bg-cyan-600 py-3 font-semibold text-white hover:bg-cyan-500 transition"
            >
                Reset Password
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            Remember your password?
            <a href="/login" class="text-cyan-400 hover:underline">Back to Login</a>
        </p>

        <p class="text-center mt-4">
            <a href="/" class="text-sm text-slate-500 hover:text-slate-300">← Back to Home</a>
        </p>
    </div>
</body>
</html>
