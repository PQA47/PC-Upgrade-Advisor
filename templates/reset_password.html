<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PC Upgrade Advisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    [data-bs-theme="light"] body { background: #F8FAFC !important; color: #1E293B !important; }
    [data-bs-theme="light"] .bg-\[\#0F172A\] { background-color: #F8FAFC !important; }
    [data-bs-theme="light"] .bg-\[\#1E293B\] { background-color: #FFFFFF !important; }
    [data-bs-theme="light"] .border-\[\#334155\] { border-color: #CBD5E1 !important; }
    [data-bs-theme="light"] .text-\[\#E2E8F0\], [data-bs-theme="light"] .text-\[\#F1F5F9\] { color: #0F172A !important; }
    [data-bs-theme="light"] .text-\[\#94A3B8\] { color: #64748B !important; }
    </style>

<style id="global-space-background">
  html, body {
    min-height: 100%;
  }

  body {
    position: relative !important;
    background-color: transparent !important;
    background-image: none !important;
  }

  /* New space image */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: url("/static/images/web-background.webp") center center / cover no-repeat;
    z-index: 0;
    pointer-events: none;
  }

  /* Original dark/neon background kept as a translucent overlay */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
      radial-gradient(circle at 10% 10%, rgba(34,211,238,.10), transparent 28%),
      radial-gradient(circle at 90% 80%, rgba(168,85,247,.12), transparent 30%),
      linear-gradient(rgba(5,7,10,.42), rgba(5,7,10,.42));
    background-size: 40px 40px, 40px 40px, auto, auto, auto;
  }

  body > * {
    position: relative;
    z-index: 1;
  }

  .grid-bg {
    display: none !important;
  }
</style>

</head>
<body class="min-h-screen bg-[#0F172A] text-[#E2E8F0] flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-[#1E293B] border border-[#334155] rounded-2xl p-8 shadow-2xl">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-[#F1F5F9]">Reset Password</h1>
            <p class="text-[#94A3B8] mt-1">Create a new password for your account</p>
        </div>

        {% if error %}
        <div class="mb-5 rounded-xl border border-[#EF4444]/30 bg-[#EF4444]/10 px-4 py-3 text-sm text-[#EF4444]">
            {{ error }}
        </div>
        {% endif %}

        <form action="/reset-password" method="POST" class="space-y-5">
            <input type="hidden" name="token" value="{{ token }}">

            <div>
                <label class="block text-sm text-[#E2E8F0] mb-2">New Password</label>
                <input
                    type="password"
                    name="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                    class="w-full rounded-xl border border-[#334155] bg-[#0F172A] px-4 py-3 text-[#E2E8F0] placeholder-[#94A3B8] outline-none focus:border-[#06B6D4] transition"
                >
            </div>

            <div>
                <label class="block text-sm text-[#E2E8F0] mb-2">Confirm New Password</label>
                <input
                    type="password"
                    name="password_confirm"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter your password again"
                    class="w-full rounded-xl border border-[#334155] bg-[#0F172A] px-4 py-3 text-[#E2E8F0] placeholder-[#94A3B8] outline-none focus:border-[#06B6D4] transition"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-xl bg-[#3B82F6] py-3 font-semibold text-[#F1F5F9] hover:bg-blue-600 transition"
            >
                Reset Password
            </button>
        </form>

        <p class="text-center text-sm text-[#94A3B8] mt-6">
            Remember your password?
            <a href="/login" class="text-[#06B6D4] hover:underline">Back to Login</a>
        </p>

        <p class="text-center mt-4">
            <a href="/" class="text-sm text-[#94A3B8] hover:text-[#E2E8F0]">← Back to Home</a>
        </p>
    </div>
</body>
</html>
