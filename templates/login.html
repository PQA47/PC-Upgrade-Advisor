<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PC Upgrade Advisor</title>
  <script>if(localStorage.getItem('theme'))document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('theme'));</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [data-bs-theme="light"] body { background: #F8FAFC !important; color: #1E293B !important; }
    [data-bs-theme="light"] .bg-\[\#0F172A\] { background-color: #F8FAFC !important; }
    [data-bs-theme="light"] .bg-\[\#1E293B\] { background-color: #FFFFFF !important; }
    [data-bs-theme="light"] .border-\[\#334155\] { border-color: #CBD5E1 !important; }
    [data-bs-theme="light"] .text-\[\#E2E8F0\], [data-bs-theme="light"] .text-\[\#F1F5F9\] { color: #0F172A !important; }
    [data-bs-theme="light"] .text-\[\#94A3B8\] { color: #64748B !important; }
  </style>
</head>
<body class="min-h-screen bg-[#0F172A] text-[#E2E8F0] flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-[#1E293B] border border-[#334155] rounded-2xl p-8 shadow-2xl">
    <div class="mb-6 flex items-start justify-between">
      <div>
        <h1 class="text-3xl font-bold text-[#F1F5F9]">Welcome back</h1>
        <p class="text-[#94A3B8] mt-1">Sign in to PC Upgrade Advisor</p>
      </div>
      <button id="themeToggle" class="rounded-lg border border-[#334155] bg-[#1E293B] px-3 py-2 text-sm text-[#E2E8F0] hover:bg-[#334155] transition" aria-label="Toggle theme">☀️</button>
    </div>
    {% if error %}
    <div class="mb-5 rounded-xl border border-[#EF4444]/30 bg-[#EF4444]/10 px-4 py-3 text-sm text-[#EF4444]">{{ error }}</div>
    {% endif %}
    <form action="/login" method="POST" class="space-y-5">
      <div>
        <label class="block text-sm text-[#E2E8F0] mb-2">Username</label>
        <input type="text" name="username" required autocomplete="username"
               class="w-full rounded-xl border border-[#334155] bg-[#0F172A] px-4 py-3 text-[#E2E8F0] placeholder-[#94A3B8] outline-none focus:border-[#06B6D4] transition">
      </div>
      <div>
        <label class="block text-sm text-[#E2E8F0] mb-2">Password</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full rounded-xl border border-[#334155] bg-[#0F172A] px-4 py-3 text-[#E2E8F0] placeholder-[#94A3B8] outline-none focus:border-[#06B6D4] transition">
      </div>
      <button type="submit" class="w-full rounded-xl bg-[#3B82F6] hover:bg-blue-600 py-3 font-semibold text-[#F1F5F9] transition">Login</button>
    </form>
    <p class="text-center text-sm text-[#94A3B8] mt-5">
      <a href="/forgot-password" class="text-[#06B6D4] hover:underline">Forgot password?</a>
    </p>
    <p class="text-center text-sm text-[#94A3B8] mt-3">
      Don't have an account?
      <a href="/register" class="text-[#06B6D4] hover:underline">Register</a>
    </p>
    <p class="text-center mt-4"><a href="/" class="text-sm text-[#94A3B8] hover:text-[#E2E8F0]">← Back to home</a></p>
  </div>
<script>
(() => {
  const btn = document.getElementById('themeToggle');
  if (btn) {
    const updateIcon = (theme) => {
      btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    };
    updateIcon(document.documentElement.getAttribute('data-bs-theme') || 'dark');
    btn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-bs-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', next);
      localStorage.setItem('theme', next);
      updateIcon(next);
    });
  }
})();
</script>
</body>
</html>
